<!-- ============ CTA OVERLAY COMPONENT ============ -->
  <section class="cta inv-cta">
    <div class="cta-frame reveal-card">
      <img class="cta-bg" src="{{root}}assets/img/cta-bg.png" alt="Coche deportivo de lujo con luces traseras rojas" loading="lazy">
      <div class="cta-overlay"></div>
      <div class="cta-content">
        <h2>{{title}}</h2>
        <p>{{sub}}</p>
        <a class="btn btn-light" href="{{root}}{{link}}">
          <span>{{btn}}</span>
          <span class="btn-chip btn-chip-dark">
            <!-- @component btn-arrow -->
          </span>
        </a>
      </div>
    </div>
  </section>
