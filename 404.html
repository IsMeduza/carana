<!DOCTYPE html>
<html lang="es">
<head>
  <!-- @component head-open -->

  <title>Página no encontrada | AUTO JUNG</title>
  <meta name="description" content="La página que buscas no existe o ya no está disponible. Vuelve al inicio de AUTO JUNG y encuentra el coche de tus sueños.">
  <meta name="robots" content="noindex, nofollow">

  <!-- @component head-close -->
  <style>
    .footer { margin-top: 0; }
    @media (max-width: 640px) { .footer { margin-top: 0; } }
  </style>
</head>
<body>
  <!-- @component header -->

  <main>
    <!-- ============ HERO 404 (ESTILO ORIGINAL FRAMER) ============ -->

        <img class="hero-bg" src="assets/img/hero.webp" alt="Coche deportivo de lujo aparcado en interior">
        <div class="hero-overlay"></div>
        
        <div class="hero-content">
          <div class="hero-inner">
            <div class="hero-top">
              <h1 class="reveal-head">Página no encontrada</h1>
              
              <!-- HERO SEARCH COMPONENT -->
              <div class="hero-search" id="searchWrap">
                <div class="hero-search-box" id="searchBox">
                  <input type="text" id="searchInput" placeholder="Buscar..." autocomplete="off">
                  <button type="button" class="search-clear-btn" id="searchClearBtn" aria-label="Borrar búsqueda" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                  </button>
                  <button class="hero-search-btn" id="searchBtn" aria-label="Buscar">

                    </svg>
                  </button>
                </div>
                <div class="hero-search-dropdown" id="searchDropdown">
                  <div class="hero-search-list" id="searchResultsList"></div>
                  <div class="search-dots">
                    <span></span><span></span><span></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="hero-bottom">
              <div class="hero-left reveal-head reveal-delay-1">
                <p>Ups, esta página tomó un desvío inesperado. No te preocupes: el camino hacia tu coche de ensueño sigue aquí.</p>
                <a class="btn btn-light" href="index.html">
                  <span>Volver al inicio</span>
                  <span class="btn-chip btn-chip-dark">
                    <span class="btn-arrow-wrap">
                      <span class="btn-arrow-track">
                        <svg class="arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

                        </svg>
                        <svg class="arrow-svg arrow-clone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M 4 12 L 19.88 12 M 13.75 18.75 L 19.44 13.06 C 19.73 12.77 19.88 12.38 19.88 12 M 13.75 5.25 L 19.44 10.94 C 19.73 11.23 19.88 11.62 19.88 12"/>
                        </svg>
                      </span>
                    </span>
                  </span>
                </a>
              </div>
              <div class="hero-stats reveal-head reveal-delay-2">
                <div class="stat-card">
                  <span class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

                      <circle cx="16" cy="12" r="1" fill="currentColor"/>
                      <path d="M 10 14.75 L 14 14.75 M 6.271 5.567 C 6.558 4.776 7.31 4.25 8.151 4.25 L 15.849 4.25 C 16.69 4.25 17.442 4.776 17.729 5.567 L 19.25 9.75 L 4.75 9.75 Z M 3.75 17.75 L 7.188 17.75 L 7.188 19.45 C 7.188 20.168 6.606 20.75 5.888 20.75 L 5.05 20.75 C 4.332 20.75 3.75 20.168 3.75 19.45 Z M 16.813 17.75 L 20.25 17.75 L 20.25 19.45 C 20.25 20.168 19.668 20.75 18.95 20.75 L 18.113 20.75 C 17.395 20.75 16.813 20.168 16.813 19.45 Z"/>
                    </svg>
                  </span>
                  <span class="stat-text"><strong>800+</strong><small>Coches vendidos</small></span>

                <div class="stat-card">
                  <span class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

                    </svg>
                  </span>
                  <span class="stat-text"><strong>$80M</strong><small>Valor de ventas</small></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- @component footer -->

  <!-- ============ GLOBAL MOTION & SCROLL COMPONENT ============ -->
  <!-- @component scripts -->
  <script src="app.js"></script>
</body>
</html>
